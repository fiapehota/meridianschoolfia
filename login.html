<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход | Meridian School</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Marck+Script&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height:100%; overflow:hidden; }
  body{
    font-family:'Manrope', 'Helvetica Neue', Arial, sans-serif;
    background:#f8f2e9;
    color:#18130f;
    -webkit-font-smoothing:antialiased;
  }
  a { color:#18130f; text-decoration:none; }
  a:hover { color:#c0202a; }
  ::selection { background:#c0202a; color:#f8f2e9; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid #18130f; outline-offset:3px; border-radius:6px; }

  .disp { font-family:'Unbounded', sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:-0.01em; }
  .script { font-family:'Marck Script', cursive; font-weight:400; }
  .navlink { font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; }
  .navlink:hover { text-decoration:underline; text-underline-offset:3px; }

  .wrap{
    height:100vh;
    height:100dvh;
    display:grid;
    grid-template-columns: minmax(360px, 560px) 1fr;
  }
  @media (max-width: 860px){
    .wrap{ grid-template-columns: 1fr; grid-template-rows: clamp(80px,13dvh,160px) 1fr; }
    .photo-panel{ order:-1; }
    .form-panel{ padding-top:14px; padding-bottom:14px; }
    .back-pill{ margin-bottom:10px; }
    .field input{ padding:11px 14px; }
    .photo-logo{ left:20px; bottom:14px; }
  }

  .form-panel{
    display:flex;
    flex-direction:column;
    justify-content:center;
    justify-content:safe center;
    min-height:0;
    overflow-y:auto;
    padding:clamp(20px,5vh,48px) clamp(28px,6vw,72px);
  }

  .back-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:4px;
    width:fit-content;
    margin-bottom:clamp(16px,4vh,40px);
  }
  .back-pill:hover{ color:#c0202a; }

  .kicker{ font-size:clamp(30px,3.6vw,42px); color:#c0202a; line-height:1; margin-bottom:6px; }
  h1{ font-size:clamp(28px,4vw,44px); line-height:0.98; margin:0 0 clamp(14px,3vh,28px); }

  .field{ text-align:left; margin-bottom:clamp(10px,2vh,16px); }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:700;
    opacity:.65;
    margin-bottom:7px;
  }
  .field input{
    width:100%;
    padding:13px 15px;
    border:1.5px solid rgba(24,19,15,0.15);
    border-radius:14px;
    background:#ffffff;
    color:#18130f;
    font-family:'Manrope',sans-serif;
    font-size:.95rem;
  }
  .field input:focus{ outline:none; border-color:#c0202a; }

  .error{
    display:none;
    text-align:left;
    font-size:.82rem;
    color:#c0202a;
    margin:-6px 0 14px;
  }
  .error.show{ display:block; }

  button[type="submit"]{
    width:100%;
    padding:15px;
    background:#4d3e31;
    color:#f8f2e9;
    border:none;
    border-radius:999px;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:.9rem;
    letter-spacing:.03em;
    cursor:pointer;
    margin-top:6px;
  }
  button[type="submit"]:hover{ background:#c0202a; }
  button[type="submit"]:disabled{ opacity:.6; cursor:default; }

  .links-row{
    display:flex;
    gap:22px;
    margin-top:18px;
    flex-wrap:wrap;
  }

  .divider{ height:1px; background:rgba(24,19,15,0.1); margin:clamp(14px,3vh,28px) 0 clamp(12px,2.5vh,22px); }

  .trial-note{ font-size:.85rem; color:#3a332c; line-height:1.5; max-width:380px; }
  .trial-note a{ font-weight:700; color:#c0202a; }
  .trial-note a:hover{ text-decoration:underline; }

  .photo-panel{
    position:relative;
    background:#18130f;
    overflow:hidden;
    min-height:0;
  }
  .photo-panel img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    opacity:.94;
  }
  .photo-logo{
    position:absolute;
    left:28px; bottom:28px;
    color:#f8f2e9;
    font-size:clamp(20px,2.4vw,30px);
    line-height:0.98;
    text-shadow:0 2px 18px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="form-panel">
    <a class="back-pill" href="index.html">← На главную</a>

    <div class="kicker script">с возвращением,</div>
    <h1 class="disp">Войти в аккаунт</h1>

    <form id="loginForm">
      <div class="field">
        <label for="email">Имя и Фамилия</label>
        <input id="email" type="text" autocomplete="username" placeholder="анна.калниня" required>
      </div>
      <div class="field">
        <label for="pass">Пароль</label>
        <input id="pass" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="err">Неправильный логин или пароль.</p>
      <button type="submit" id="submitBtn">Войти в кабинет →</button>
    </form>

    <div class="links-row">
      <a class="navlink" href="#" onclick="alert('Пароль можно поменять только через Фию — напиши в Telegram или позвони.'); return false;">Забыли пароль?</a>
      <a class="navlink" href="#" style="opacity:.55;" onclick="alert('Родительский доступ появится позже.'); return false;">Родительский доступ</a>
    </div>

    <div class="divider"></div>

    <p class="trial-note">Ещё не учишься у нас? Первый урок — бесплатный пробный, 40 минут. <a href="index.html#contact">Записаться на сайте →</a></p>
  </div>

  <div class="photo-panel">
    <img src="about_locker.jpg" alt="Meridian School">
    <div class="photo-logo disp">MERIDIAN<br>SCHOOL</div>
  </div>
</div>

<script type="module">
  import { auth } from "./assets/js/firebase-config.js";
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

  const form = document.getElementById("loginForm");
  const email = document.getElementById("email");
  const pass = document.getElementById("pass");
  const err = document.getElementById("err");
  const btn = document.getElementById("submitBtn");

  // куда вернуть человека после входа
  const params = new URLSearchParams(window.location.search);
  const next = params.get("next") || "kabinet.html";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "...";

    // ученик вводит просто "имя.фамилия" — домен добавляем сами,
    // чтобы Firebase получил корректный email-формат
    let loginValue = email.value.trim().toLowerCase();
    if (!loginValue.includes("@")) {
      loginValue += "@meridian.local";
    }

    try {
      await signInWithEmailAndPassword(auth, loginValue, pass.value);
      window.location.replace(next);
    } catch (e) {
      err.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Войти в кабинет →";
    }
  });
</script>

</body>
</html>
