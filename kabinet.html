<script>
(function () {
  var menuBtn = document.getElementById('menuBtn');
  var mobileNav = document.getElementById('mobileNav');
  if (!menuBtn || !mobileNav) return;

  var iconHamburger = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="12" x2="21" y2="12" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="17" x2="21" y2="17" stroke="#18130f" stroke-width="2" stroke-linecap="round"/></svg>';
  var iconClose = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="#18130f" stroke-width="2" stroke-linecap="round"/></svg>';

  function closeMenu() {
    mobileNav.hidden = true;
    menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.innerHTML = iconHamburger;
  }
  function openMenu() {
    mobileNav.hidden = false;
    menuBtn.setAttribute('aria-expanded', 'true');
    menuBtn.innerHTML = iconClose;
  }

  menuBtn.addEventListener('click', function () {
    if (mobileNav.hidden) { openMenu(); } else { closeMenu(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !mobileNav.hidden) {
      closeMenu();
      menuBtn.focus();
    }
  });

  document.addEventListener('click', function (e) {
    if (!mobileNav.hidden && !mobileNav.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
      closeMenu();
    }
  });

  mobileNav.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', closeMenu);
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth > 980 && !mobileNav.hidden) { closeMenu(); }
  });
})();
</script>

<script type="module">
  import { auth, db } from "./assets/js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  // расписание — публичный Google Calendar только с уроками
  const CALENDAR_ID = "027d9547736afe5b445e10c3f039e99e46481562e9063146a0d075658348772e@group.calendar.google.com";
  const CALENDAR_API_KEY = "AIzaSyCybGpL9j3nX5O2Moi-Ao-3whgs48rBi-k";

  // предметы: id -> подпись, фото, всегда ли заблокирован (пока нет материалов)
  const SUBJECTS = {
    english:   { label: "Английский", photo: "subject_english.jpg",   alwaysLocked: false },
    math:      { label: "Математика", photo: "subject_math.jpg",      alwaysLocked: false },
    physics:   { label: "Физика",     photo: "subject_physics.jpg",   alwaysLocked: true  },
    chemistry: { label: "Химия",      photo: "subject_chemistry.jpg", alwaysLocked: true  },
  };

  function renderSubjects(unlockedIds) {
    const grid = document.getElementById("subjGrid");
    grid.innerHTML = "";
    Object.entries(SUBJECTS).forEach(([id, s]) => {
      const isLocked = s.alwaysLocked || !unlockedIds.includes(id);
      const el = document.createElement(isLocked ? "div" : "a");
      el.className = "subj-card" + (isLocked ? " locked" : "");
      if (!isLocked) el.href = `predmet.html?id=${id}`;
      el.innerHTML = `
        <div class="bg" style="background-image:url('${s.photo}')"></div>
        <div class="veil"></div>
        ${isLocked ? '<div class="lock-badge">🔒</div>' : ''}
        <div class="label disp">${s.label}</div>
      `;
      grid.appendChild(el);
    });
  }

  // ищем в календаре ближайший урок этого ученика.
  // события называются строго "Имя Ф. - Предмет", например "Лиза К. - Английский"
  async function fetchNextLesson(studentName) {
    if (!studentName) return null;
    const norm = s => s.trim().toLowerCase();

    const url = new URL(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`);
    url.searchParams.set("key", CALENDAR_API_KEY);
    url.searchParams.set("timeMin", new Date().toISOString());
    url.searchParams.set("singleEvents", "true");
    url.searchParams.set("orderBy", "startTime");
    url.searchParams.set("maxResults", "20");

    let events;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Calendar API ${res.status}`);
      const data = await res.json();
      events = data.items || [];
    } catch (e) {
      console.warn("Не удалось получить расписание из календаря:", e);
      return null;
    }

    for (const ev of events) {
      if (!ev.summary || !ev.start || !ev.start.dateTime) continue; // пропускаем события "на весь день" и без названия
      const [namePart, subjectPart] = ev.summary.split(" - ");
      if (!namePart || !subjectPart) continue;
      if (norm(namePart) !== norm(studentName)) continue;

      const start = new Date(ev.start.dateTime);
      const end = ev.end && ev.end.dateTime ? new Date(ev.end.dateTime) : null;
      const durationMin = end ? Math.round((end - start) / 60000) : null;
      const subjectLabel = subjectPart.trim();
      const subjectId = Object.keys(SUBJECTS).find(id => SUBJECTS[id].label.toLowerCase() === subjectLabel.toLowerCase()) || "english";

      return {
        subject: subjectId,
        subjectLabel,
        datetime: { toDate: () => start },
        duration: durationMin ? `${durationMin} минут` : "",
        teacher: "Фиёй",
        joinUrl: ev.hangoutLink || null,
      };
    }
    return null; // среди ближайших 20 событий урока этого ученика не нашлось
  }

  // считаем "через сколько" каждый раз заново, от реального времени
  function formatUntil(target) {
    const diffMs = target.getTime() - Date.now();
    if (diffMs <= 0) return null; // урок уже наступил или прошёл
    const mins = Math.round(diffMs / 60000);
    if (mins < 60) return `${mins} мин`;
    const hours = Math.floor(mins / 60);
    const rem = mins % 60;
    if (hours < 24) return rem ? `${hours} ч ${rem} мин` : `${hours} ч`;
    const days = Math.floor(hours / 24);
    return `${days} дн`;
  }

  function formatDateLabel(target) {
    const now = new Date();
    const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const diffDays = Math.round((startOfDay(target) - startOfDay(now)) / 86400000);
    if (diffDays === 0) return "Сегодня";
    if (diffDays === 1) return "Завтра";
    return target.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  }

  function formatTime(target) {
    return target.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }

  function renderHero(next) {
    const bg = document.getElementById("heroBg");
    const tagText = document.getElementById("heroTagText");
    const subjectEl = document.getElementById("heroSubject");
    const metaEl = document.getElementById("heroMeta");
    const joinBtn = document.getElementById("heroJoinBtn");
    const sideStatus = document.getElementById("sideStatus");
    const sideStatusText = document.getElementById("sideStatusText");

    // достаём реальную дату урока (Firestore Timestamp -> JS Date)
    const lessonDate = next && next.datetime && next.datetime.toDate ? next.datetime.toDate() : null;
    const until = lessonDate ? formatUntil(lessonDate) : null;

    if (!next || !lessonDate || !until) {
      bg.style.backgroundImage = `url('${SUBJECTS.english.photo}')`;
      tagText.textContent = "Пока нет запланированных уроков";
      subjectEl.textContent = "Загляни в расписание";
      metaEl.textContent = "";
      joinBtn.style.display = "none";
      sideStatus.style.display = "none";
      return;
    }

    const s = SUBJECTS[next.subject] || SUBJECTS.english;
    bg.style.backgroundImage = `url('${s.photo}')`;
    tagText.textContent = `Следующий урок · через ${until}`;
    subjectEl.textContent = next.subjectLabel || s.label;
    metaEl.textContent = [formatDateLabel(lessonDate), formatTime(lessonDate), next.duration, next.teacher ? `с ${next.teacher}` : null]
      .filter(Boolean).join(" · ");
    if (next.joinUrl) {
      joinBtn.onclick = () => window.open(next.joinUrl, "_blank");
    } else {
      joinBtn.onclick = () => alert("Ссылка на урок появится ближе ко времени занятия.");
    }

    sideStatus.style.display = "flex";
    sideStatusText.textContent = `Урок через ${until}`;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) return; // auth-guard.js уже отправит на login.html

    const local = (user.email || "").split("@")[0];
    const fallbackName = local.split(".").filter(Boolean)
      .map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ") || "ученик";

    let data = null;
    try {
      const snap = await getDoc(doc(db, "students", user.email));
      if (snap.exists()) data = snap.data();
    } catch (e) {
      console.warn("Не удалось прочитать данные ученика:", e);
    }

    const name = (data && data.name) || fallbackName;
    document.getElementById("sideName").textContent = name;
    document.getElementById("avatarCircle").textContent = name.charAt(0).toUpperCase();
    try {
      const savedAvatar = localStorage.getItem(`meridian_avatar_${user.email || ""}`);
      if (savedAvatar) document.getElementById("avatarCircle").innerHTML = `<img src="assets/avatars/${savedAvatar}" alt="">`;
    } catch (e) {}

    renderSubjects((data && data.subjects) || []);

    // calendarName — как ученик подписан в календаре ("Лиза К."), отдельно от имени в приветствии
    const calendarName = (data && data.calendarName) || name;
    const next = await fetchNextLesson(calendarName);
    renderHero(next);
  });
</script>

</body>
</html>
