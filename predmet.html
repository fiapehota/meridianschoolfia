<script>
(function () {
  var menuBtn = document.getElementById('menuBtn');
  var mobileNav = document.getElementById('mobileNav');
  if (!menuBtn || !mobileNav) return;

  var iconHamburger = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="12" x2="21" y2="12" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="17" x2="21" y2="17" stroke="#18130f" stroke-width="2" stroke-linecap="round"/></svg>';
  var iconClose = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="#18130f" stroke-width="2" stroke-linecap="round"/></svg>';

  function closeMenu() {
    mobileNav.hidden = true;
    menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.innerHTML = iconHamburger;
  }
  function openMenu() {
    mobileNav.hidden = false;
    menuBtn.setAttribute('aria-expanded', 'true');
    menuBtn.innerHTML = iconClose;
  }

  menuBtn.addEventListener('click', function () {
    if (mobileNav.hidden) { openMenu(); } else { closeMenu(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !mobileNav.hidden) {
      closeMenu();
      menuBtn.focus();
    }
  });

  document.addEventListener('click', function (e) {
    if (!mobileNav.hidden && !mobileNav.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
      closeMenu();
    }
  });

  mobileNav.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', closeMenu);
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth > 980 && !mobileNav.hidden) { closeMenu(); }
  });
})();
</script>

<script type="module">
  import { auth, db } from "./assets/js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const SUBJECT_INFO = {
    english: {
      label: "Английский",
      teacher: "Фия",
      duration: "60 минут",
      photo: "subject_english.jpg",
      description: [
        "Conversational English and grammar built around fresh, current topics.",
        "Not just textbook English — the kind you'll actually use in real conversation!"
      ]
    },
    math: {
      label: "Математика",
      teacher: "Фия",
      duration: "60 минут",
      photo: "subject_math.jpg",
      description: [
        "Школьная программа по математике свежим взглядом. То, что раньше казалось страшным — обретает смысл!",
        "Легко и просто разбираем тему за темой, решаем примеры вместе, без зубрёжки формул наизусть."
      ]
    }
  };

  const MATERIALS = {
    english: [
      { grade: "5 класс", items: [
        { file: "english_5gr_presentsimple_theory.html", icon: "icon_present_simple_theory.jpg", title: "Present Simple", type: "Теория" },
        { file: "english_5gr_presentsimple_practice.html", icon: "icon_present_simple_practice.jpg", title: "Present Simple", type: "Практика" },
        { file: "english_5gr_vocabulary_numbers_theory.html", icon: "icon_numbers_theory.jpg", title: "Numbers", type: "Теория" },
        { file: "english_5gr_vocabulary_numbers_practice.html", icon: "icon_numbers_practice.jpg", title: "Numbers", type: "Практика" },
        { file: "english_5gr_vocabulary_numbers_test.html", icon: "icon_numbers_test.jpg", title: "Numbers", type: "Тест" },
        { file: "english_5gr_vocabulary_colors_practice.html", icon: "icon_colors_practice.jpg", title: "Colors", type: "Практика" },
      ]},
      { grade: "6 класс", items: [
        { file: "english_6gr_presentcontinuous_theory.html", icon: "icon_present_continuous_theory.jpg", title: "Present Continuous", type: "Теория" },
        { file: "english_6gr_presentcontinuous_practice.html", icon: "icon_present_continuous_practice.jpg", title: "Present Continuous", type: "Практика" },
        { file: "english_6gr_simplevscontinuous_practice.html", icon: "icon_simple_vs_continuous.jpg", title: "Simple vs Continuous", type: "Практика" },
        { file: "english_6gr_appearance_theory.html", icon: "icon_appearance_theory.jpg", title: "Appearance", type: "Теория" },
        { file: "english_6gr_appearance_practice.html", icon: "icon_appearance_practice.jpg", title: "Appearance", type: "Практика" },
        { file: "english_6gr_appearance_writing.html", icon: "icon_appearance_writing.jpg", title: "Appearance", type: "Письмо" },
        { file: "english_6gr_vocabulary_house.html", icon: "icon_house_and_rooms.jpg", title: "House & Rooms", type: "Слова" },
        { file: "english_6gr_vocabulary_house_quiz.html", icon: "icon_house_and_rooms_quizz.jpg", title: "House & Rooms", type: "Квиз" },
        { file: "english_6gr_vocabulary_cooking.html", icon: "icon_cooking.jpg", title: "Cooking", type: "Слова" },
      ]},
      { grade: "7 класс", items: [
        { file: "english_7gr_pasttense_theory1.html", icon: "icon_past_simple_teorija.jpg", title: "Past Simple", type: "Теория" },
        { file: "english_7gr_pasttense_irregular_table.html", icon: "icon_past_simple_tabule.jpg", title: "Irregular Verbs", type: "Таблица" },
        { file: "english_7gr_pasttense_irregular_test.html", icon: "icon_irregular_verb_table_test.jpg", title: "Irregular Verbs", type: "Тест" },
        { file: "english_7gr_prepositions_theory.html", icon: "icon_prepositions_theory.jpg", title: "Prepositions", type: "Теория" },
        { file: "english_7gr_prepositions_practice.html", icon: "icon_prepositions_practice.jpg", title: "Prepositions", type: "Практика" },
        { file: "english_7gr_prepositions_writing.html", icon: "icon_prepositions_writing.jpg", title: "Prepositions", type: "Письмо" },
        { file: "english_7gr_questionwords_theory.html", icon: "icon_question_words_theory.jpg", title: "Question Words", type: "Теория" },
        { file: "english_7gr_questionwords_practice.html", icon: "icon_question_words_practice.jpg", title: "Question Words", type: "Практика" },
        { file: "english_7gr_futuresimple_writing.html", icon: "icon_future_simple_writing.jpeg", title: "Future Simple", type: "Письмо" },
      ]},
    ],
    math: [
      { grade: "5 класс", items: [
        { file: "math_5gr_saskaitisana_atnemsana_practice.html", icon: "icon_saskaitisana_atnemsana.jpg", title: "Сложение и вычитание в столбик", type: "Практика" },
        { file: "math_5gr_reizinasana_practice.html", icon: "icon_reizinasana.jpg", title: "Умножение в столбик", type: "Практика" },
      ]},
      { grade: "6 класс", items: [
        { file: "math_6kl_negativnye_chisla_stolbik.html", icon: "icon_negativnye_chisla.jpg", title: "Отрицательные числа в столбик", type: "Практика" },
      ]},
      { grade: "7 класс", items: [
        { file: "matematika-7-klase-intervali-teorija.html", icon: "icon_intervali_teorija.jpg", title: "Числовые интервалы", type: "Теория" },
        { file: "matematika-7-klase-intervali-uzdevumi.html", icon: "icon_intervali_uzdevumi.jpg", title: "Числовые интервалы", type: "Задачи" },
      ]},
      { grade: "8 класс", items: [
        { file: "sakniuzdevumi.html", icon: "icon_kvadratsaknes_uzdevumi.jpg", title: "Квадратные корни", type: "Задачи" },
      ]},
      { grade: "Инструменты", items: [
        { file: "math_calculator.html", icon: "icon_math_calculator.jpg", title: "Калькулятор", type: "" },
      ]},
    ],
  };

  const params = new URLSearchParams(window.location.search);
  const subjId = params.get("id") || "english";
  const info = SUBJECT_INFO[subjId] || SUBJECT_INFO.english;
  const materials = MATERIALS[subjId] || [];

  document.title = `${info.label} | Meridian School`;
  document.getElementById("subjEyebrow").textContent = `${info.teacher} · ${info.duration}`;
  document.getElementById("subjTitle").textContent = info.label;
  document.getElementById("subjPhoto").src = info.photo;
  document.getElementById("subjPhoto").alt = info.label;
  document.getElementById("subjDesc").innerHTML = info.description.map(p => `<p>${p}</p>`).join("");

  const wrap = document.getElementById("materialsWrap");
  materials.forEach(group => {
    const h = document.createElement("div");
    h.className = "grade-label";
    h.textContent = group.grade;
    wrap.appendChild(h);

    const grid = document.createElement("div");
    grid.className = "mat-grid";
    group.items.forEach(m => {
      const a = document.createElement("a");
      a.className = "mat-card";
      a.href = m.file;
      a.innerHTML = `
        <img src="${m.icon}" alt="">
        <div class="mt">${m.title}</div>
        ${m.type ? `<div class="mtype">${m.type}</div>` : ""}
      `;
      grid.appendChild(a);
    });
    wrap.appendChild(grid);
  });

  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    const local = (user.email || "").split("@")[0];
    const fallbackName = local.split(".").filter(Boolean)
      .map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ") || "ученик";
    let data = null;
    try {
      const snap = await getDoc(doc(db, "students", user.email));
      if (snap.exists()) data = snap.data();
    } catch (e) {}
    const name = (data && data.name) || fallbackName;
    document.getElementById("avatarCircle").textContent = name.charAt(0).toUpperCase();
    try {
      const savedAvatar = localStorage.getItem(`meridian_avatar_${user.email || ""}`);
      if (savedAvatar) document.getElementById("avatarCircle").innerHTML = `<img src="assets/avatars/${savedAvatar}" alt="">`;
    } catch (e) {}
  });
