    .page-title { font-size:clamp(30px,4vw,48px); line-height:0.98; margin-bottom:32px; }

    .profile-card {

    .btn-ghost-dark {
      font-family:'Manrope',sans-serif; font-weight:700; font-size:14px;

      border-radius:999px; padding:13px 24px; cursor:pointer; margin-bottom:24px;

    .avatar-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:14px; max-width:800px; }
    @media (max-width: 900px) { .avatar-grid { grid-template-columns:repeat(6,1fr); } }
    @media (max-width: 640px) { .avatar-grid { grid-template-columns:repeat(4,1fr); } }
    .avatar-option {
      aspect-ratio:1/1; border-radius:50%; overflow:hidden; cursor:pointer;
      border:3px solid transparent; padding:0; background:none; display:block; width:100%;
    }
    .avatar-option img { width:100%; height:100%; object-fit:cover; display:block; }
    .avatar-option:hover { border-color:rgba(24,19,15,0.2); }
    .avatar-option.selected { border-color:#c0202a; }
</style>

<script>
(function () {
  var menuBtn = document.getElementById('menuBtn');
  var mobileNav = document.getElementById('mobileNav');
  if (!menuBtn || !mobileNav) return;

  var iconHamburger = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="3" y1="7" x2="21" y2="7" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="12" x2="21" y2="12" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="17" x2="21" y2="17" stroke="#18130f" stroke-width="2" stroke-linecap="round"/></svg>';
  var iconClose = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19" stroke="#18130f" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="#18130f" stroke-width="2" stroke-linecap="round"/></svg>';

  function closeMenu() {
    mobileNav.hidden = true;
    menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.innerHTML = iconHamburger;
  }
  function openMenu() {
    mobileNav.hidden = false;
    menuBtn.setAttribute('aria-expanded', 'true');
    menuBtn.innerHTML = iconClose;
  }

  menuBtn.addEventListener('click', function () {
    if (mobileNav.hidden) { openMenu(); } else { closeMenu(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !mobileNav.hidden) {
      closeMenu();
      menuBtn.focus();
    }
  });

  document.addEventListener('click', function (e) {
    if (!mobileNav.hidden && !mobileNav.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
      closeMenu();
    }
  });

  mobileNav.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', closeMenu);
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth > 980 && !mobileNav.hidden) { closeMenu(); }
  });
})();
</script>

<script type="module">
  import { auth, db } from "./assets/js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const AVATAR_COUNT = 25;

  function storageKey(email) {
    return `meridian_avatar_${email}`;
  }

  function applyAvatar(fileName, initial) {
    const headerEl = document.getElementById("avatarCircle");
    const profileEl = document.getElementById("profileAvatar");
    if (fileName) {
      const src = `assets/avatars/${fileName}`;
      headerEl.innerHTML = `<img src="${src}" alt="">`;
      profileEl.innerHTML = `<img src="${src}" alt="">`;
    } else {
      headerEl.textContent = initial;
      profileEl.textContent = initial;
    }
  }

  function renderAvatarGrid(email, initial) {
    const grid = document.getElementById("avatarGrid");
    grid.innerHTML = "";
    const saved = localStorage.getItem(storageKey(email));

    for (let i = 1; i <= AVATAR_COUNT; i++) {
      const fileName = `avatar-${String(i).padStart(2, "0")}.jpg`;
      const btn = document.createElement("button");
      btn.className = "avatar-option" + (saved === fileName ? " selected" : "");
      btn.innerHTML = `<img src="assets/avatars/${fileName}" alt="">`;
      btn.addEventListener("click", () => {
        localStorage.setItem(storageKey(email), fileName);
        applyAvatar(fileName, initial);
        grid.querySelectorAll(".avatar-option").forEach(el => el.classList.remove("selected"));
        btn.classList.add("selected");
      });
      grid.appendChild(btn);
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) return; // auth-guard.js уже отправит на login.html

    const email = user.email || "";
    const local = email.split("@")[0];
    const fallbackName = local.split(".").filter(Boolean)
      .map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ") || "ученик";

    let data = null;
    try {
      const snap = await getDoc(doc(db, "students", email));
      if (snap.exists()) data = snap.data();
    } catch (e) {
      console.warn("Не удалось прочитать данные ученика:", e);
    }

    const name = (data && data.name) || fallbackName;
    const initial = name.charAt(0).toUpperCase();

    document.getElementById("sideName").textContent = name;
    document.getElementById("profileName").textContent = name;

    const saved = localStorage.getItem(storageKey(email));
    applyAvatar(saved, initial);
    renderAvatarGrid(email, initial);

    document.getElementById("toggleAvatarBtn").addEventListener("click", () => {
      const picker = document.getElementById("avatarPicker");
      const btn = document.getElementById("toggleAvatarBtn");
      const isHidden = picker.style.display === "none";
      picker.style.display = isHidden ? "block" : "none";
      btn.textContent = isHidden ? "Скрыть выбор аватарки" : "Изменить аватарку";
    });
  });
</script>
